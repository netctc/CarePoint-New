name: Entorno V3 Online Test Lane

on:
  pull_request:
    branches: [entorno-v3]
  push:
    branches: [entorno-v3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entorno-v3-test-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CAREPOINT_V3_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CAREPOINT_V3_API_BASE: https://api-v3-validation.invalid/api/v1

jobs:
  node-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CAREPOINT_V3_SOURCE_SHA }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build

  flutter-web:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app:
          - patient-mobile
          - doctor-mobile
          - provider-mobile
          - transport-provider-mobile
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CAREPOINT_V3_SOURCE_SHA }}
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock
      - name: Analyze app
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze
      - name: Build V3 staging web app
        working-directory: apps/${{ matrix.app }}
        run: >-
          flutter build web --release
          --dart-define=CAREPOINT_BUILD_ENV=staging
          --dart-define=CAREPOINT_API_BASE=${{ env.CAREPOINT_V3_API_BASE }}
          --dart-define=CAREPOINT_RELEASE_SHA=${{ env.CAREPOINT_V3_SOURCE_SHA }}

  staging-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CAREPOINT_V3_SOURCE_SHA }}
      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in ops/test-v3/scripts/*.sh; do
            bash -n "$script"
          done
      - name: Enforce non-production boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find ops/test-v3 -type f -name '.env*' -print)"
          grep -q '^name: carepoint-v3-test$' ops/test-v3/compose.yaml
          grep -q '127.0.0.1:4300:4200' ops/test-v3/compose.yaml
          grep -q '127.0.0.1:3300:3200' ops/test-v3/compose.yaml
          grep -q '127.0.0.1:8380:80' ops/test-v3/compose.yaml
          grep -q '127.0.0.1:8381:80' ops/test-v3/compose.yaml
          grep -q '127.0.0.1:8382:80' ops/test-v3/compose.yaml
          grep -q '127.0.0.1:8383:80' ops/test-v3/compose.yaml
          ! grep -Eq '0\.0\.0\.0:(5432|6379)' ops/test-v3/compose.yaml
          grep -q 'PAYMENT_GATEWAY_PROVIDER: mock' ops/test-v3/compose.yaml
          grep -q 'TELEHEALTH_PROVIDER: mock' ops/test-v3/compose.yaml
          grep -q 'TEST_TRANSPORT_PROVIDER_DOMAIN' ops/test-v3/compose.yaml
          grep -q 'APP_PATH: apps/transport-provider-mobile' ops/test-v3/compose.yaml
      - name: Validate Nginx six-domain contract
        shell: bash
        run: |
          set -euo pipefail
          template=ops/test-v3/nginx/carepoint-v3-http.conf.template
          for marker in API ADMIN PATIENT DOCTOR PROVIDER TRANSPORT_PROVIDER; do
            grep -q "__${marker}_DOMAIN__" "$template"
          done
          for port in 4300 3300 8380 8381 8382 8383; do
            grep -q "127.0.0.1:${port}" "$template"
          done
      - name: Validate Compose syntax without secrets
        run: docker compose -f ops/test-v3/compose.yaml config --no-interpolate >/dev/null

  rich-data-runtime:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: carepoint_test
          POSTGRES_PASSWORD: carepoint-v3-ci-postgres-password
          POSTGRES_DB: carepoint_v3_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carepoint_test -d carepoint_v3_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://carepoint_test:carepoint-v3-ci-postgres-password@127.0.0.1:5432/carepoint_v3_ci_test?schema=public
      CAREPOINT_RICH_TEST_DATA_CONFIRM: RESET_AND_CREATE_RICH_SYNTHETIC_DATA
      CAREPOINT_TEST_FIXTURE_PASSWORD: CarePointV3CiFixturePassword2026
      CAREPOINT_TEST_FIXTURE_EMAIL_DOMAIN: ci.carepoint.test
      CAREPOINT_TEST_FIXTURE_TIMEZONE: Asia/Riyadh
      CAREPOINT_RICH_TEST_PATIENT_COUNT: "50"
      CAREPOINT_RICH_TEST_DOCTORS_PER_SPECIALTY: "1"
      CAREPOINT_RICH_TEST_PROVIDERS_PER_CATEGORY: "1"
      CLINICAL_KEY_PROVIDER: local
      CLINICAL_ENVELOPE_KEY_ID: ci-clinical-kek-v1
      CLINICAL_ENVELOPE_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CAREPOINT_V3_SOURCE_SHA }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build rich-data runtime dependencies
        run: |
          npm run build --workspace @carepoint/contracts
          npm run build --workspace @carepoint/identity
          npm run build --workspace @carepoint/security
          npm run build --workspace @carepoint/api
      - name: Apply full Prisma migration history
        run: npm run db:deploy --workspace @carepoint/api
      - name: Execute guarded rich synthetic reset against PostgreSQL 16
        run: npm run db:test-rich-reset --workspace @carepoint/api
      - name: Bootstrap requested admin after rich reset
        env:
          BOOTSTRAP_ADMIN_EMAIL: admin@carepoint.test
          BOOTSTRAP_ADMIN_PASSWORD: CarePointV3CiAdminPassword2026
        run: npm run db:bootstrap --workspace @carepoint/api
      - name: Verify requested admin and audit runtime singletons
        run: |
          node - <<'NODE'
          const { PrismaClient } = require("@prisma/client");
          const prisma = new PrismaClient();
          (async () => {
            const [user, head, policy] = await Promise.all([
              prisma.user.findUnique({ where: { email: "admin@carepoint.test" } }),
              prisma.auditIntegrityHead.findUnique({ where: { id: "default" } }),
              prisma.auditRetentionPolicy.findUnique({ where: { id: "default" } }),
            ]);
            if (!user || user.role !== "ADMIN" || user.status !== "ACTIVE") {
              throw new Error("Requested V3 admin was not created as an active ADMIN.");
            }
            if (!head || head.lastAuditEventId !== null || head.lastEventHash !== null) {
              throw new Error("AuditIntegrityHead/default was not restored cleanly after rich reset.");
            }
            if (!policy || policy.mode !== "INDEFINITE" || policy.legalHoldEnabled !== false) {
              throw new Error("AuditRetentionPolicy/default was not restored after rich reset.");
            }
          })().finally(() => prisma.$disconnect());
          NODE

