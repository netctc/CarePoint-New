name: C7 Patch Env Example

on:
  push:
    branches:
      - feature/phase-c7-durable-notification-outbox

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-c7-durable-notification-outbox
      - name: Add durable notification worker settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('services/api/.env.example')
          source = path.read_text()
          old = "NOTIFICATION_GATEWAY_PROVIDER=mock\nNOTIFICATION_GATEWAY_BASE_URL=\nNOTIFICATION_GATEWAY_API_KEY=\n"
          new = "NOTIFICATION_GATEWAY_PROVIDER=mock\nNOTIFICATION_GATEWAY_BASE_URL=\nNOTIFICATION_GATEWAY_API_KEY=\nNOTIFICATION_GATEWAY_TIMEOUT_MS=10000\n\n# Phase C7 durable notification outbox worker. PostgreSQL is the source of truth.\n# Production currently requires this in-process worker to remain enabled.\nNOTIFICATION_WORKER_ENABLED=true\nNOTIFICATION_WORKER_POLL_MS=1000\nNOTIFICATION_WORKER_LEASE_SECONDS=60\nNOTIFICATION_WORKER_BATCH_SIZE=25\nNOTIFICATION_MAX_ATTEMPTS=5\nNOTIFICATION_RETRY_BASE_SECONDS=5\n"
          if old not in source:
              raise SystemExit('Notification gateway env block not found')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit C7 environment reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/.env.example
          git commit -m "docs(c7): expose durable notification worker settings"
          git push origin HEAD:feature/phase-c7-durable-notification-outbox
