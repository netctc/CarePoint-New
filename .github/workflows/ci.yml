name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: carepoint
          POSTGRES_PASSWORD: carepoint
          POSTGRES_DB: carepoint
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U carepoint -d carepoint"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://carepoint:carepoint@127.0.0.1:5432/carepoint?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      ALLOWED_ORIGINS: http://localhost:3000
      MFA_KEY_PROVIDER: local
      MFA_ENVELOPE_KEY_ID: ci-mfa-kek-v1
      MFA_ENVELOPE_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      TELEHEALTH_PROVIDER: mock
      TELEHEALTH_KEY_PROVIDER: local
      TELEHEALTH_ENVELOPE_KEY_ID: ci-telehealth-kek-v1
      TELEHEALTH_ENVELOPE_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      TELEHEALTH_MOCK_SIGNING_SECRET: carepoint-ci-mock-signing-secret
      CLINICAL_KEY_PROVIDER: local
      CLINICAL_ENVELOPE_KEY_ID: ci-clinical-kek-v1
      CLINICAL_ENVELOPE_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      ORDER_KEY_PROVIDER: local
      ORDER_ENVELOPE_KEY_ID: ci-orders-kek-v1
      ORDER_ENVELOPE_KEY_BASE64: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=
      ORDER_SIGNING_PROVIDER: local
      ORDER_SIGNING_KEY_ID: ci-orders-signing-v1
      ORDER_SIGNING_SECRET_BASE64: AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM=
      DOCUMENT_STORAGE_PROVIDER: local
      DOCUMENT_STORAGE_LOCAL_ROOT: /tmp/carepoint-documents
      DOCUMENT_KEY_PROVIDER: local
      DOCUMENT_ENVELOPE_KEY_ID: ci-documents-kek-v1
      DOCUMENT_ENVELOPE_KEY_BASE64: BAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQ=
      DOCUMENT_SIGNING_PROVIDER: local
      DOCUMENT_SIGNING_KEY_ID: ci-documents-signing-v1
      DOCUMENT_SIGNING_SECRET_BASE64: BQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQU=
      PAYMENT_GATEWAY_PROVIDER: mock
      INSURANCE_GATEWAY_PROVIDER: mock
      CLAIMS_GATEWAY_PROVIDER: mock
      CLAIMS_MOCK_DENIAL_THRESHOLD_MINOR: 100000
      MESSAGING_KEY_PROVIDER: local
      MESSAGING_ENVELOPE_KEY_ID: ci-messaging-kek-v1
      MESSAGING_ENVELOPE_KEY_BASE64: BgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgY=
      NOTIFICATION_GATEWAY_PROVIDER: mock
      SLICE6_DOCTOR_PASSWORD: CarePoint-Doctor#2026
      SLICE6_PATIENT_PASSWORD: CarePoint-Patient#2026
      BOOTSTRAP_ADMIN_EMAIL: admin-ci@carepoint.test
      BOOTSTRAP_ADMIN_PASSWORD: CarePoint-CI-Admin#2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run test
      - run: npm run db:deploy
      - run: npm run db:bootstrap
      - name: Start API
        run: |
          npm --workspace @carepoint/api run start > /tmp/carepoint-api.log 2>&1 &
          echo $! > /tmp/carepoint-api.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/api/v1/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/carepoint-api.log
          exit 1
      - name: IAM persistence smoke test
        run: |
          node <<'NODE'
          const base = 'http://127.0.0.1:4000/api/v1';
          async function json(path, init = {}) {
            const response = await fetch(base + path, { ...init, headers: { 'content-type': 'application/json', ...(init.headers || {}) } });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(`${init.method || 'GET'} ${path} -> ${response.status} ${JSON.stringify(body)}`);
            return body;
          }
          const health = await json('/health');
          if (health.status !== 'ok') throw new Error('health probe failed');
          await json('/iam/register/patient', { method: 'POST', body: JSON.stringify({ email: 'patient-ci@carepoint.test', password: 'CarePoint-Patient#2026', firstName: 'CI', lastName: 'Patient' }) });
          const login = await json('/iam/login', { method: 'POST', body: JSON.stringify({ email: 'patient-ci@carepoint.test', password: 'CarePoint-Patient#2026' }) });
          if (!login.accessToken) throw new Error('login did not return an access token');
          const me = await json('/iam/accounts/me', { headers: { authorization: `Bearer ${login.accessToken}` } });
          if (me.email !== 'patient-ci@carepoint.test') throw new Error('authenticated account mismatch');
          const denied = await fetch(base + '/iam/accounts/me');
          if (denied.status !== 401) throw new Error(`expected 401 without bearer token, got ${denied.status}`);
          NODE
      - name: Slice 2 scheduling and concurrency smoke test
        run: node services/api/scripts/slice2-smoke.mjs
      - name: Slice 3 secure telemedicine smoke test
        run: node services/api/scripts/slice3-smoke.mjs
      - name: Slice 3.1 encrypted clinical record smoke test
        run: node services/api/scripts/slice31-smoke.mjs
      - name: Slice 4 clinical orders and laboratory smoke test
        run: node services/api/scripts/slice4-smoke.mjs
      - name: Slice 5 encrypted clinical documents smoke test
        run: node services/api/scripts/slice5-smoke.mjs
      - name: Slice 6 payments insurance and financial operations smoke test
        run: node services/api/scripts/slice6-smoke.mjs
      - name: Slice 6.2 claims EOB and revenue cycle smoke test
        run: node services/api/scripts/slice62-smoke.mjs
      - name: Slice 7 secure messaging notifications and care coordination smoke test
        run: node services/api/scripts/slice7-smoke.mjs
      - name: Slice 8 medical transport and emergency dispatch smoke test
        run: node services/api/scripts/slice8-smoke.mjs
      - name: Print API log on failure
        if: failure()
        run: cat /tmp/carepoint-api.log || true

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Test shared mobile client
        working-directory: packages/mobile_core
        run: flutter pub get && flutter analyze && flutter test
      - name: Analyze patient app
        working-directory: apps/patient-mobile
        run: flutter pub get && flutter analyze
      - name: Analyze doctor app
        working-directory: apps/doctor-mobile
        run: flutter pub get && flutter analyze
      - name: Analyze provider app
        working-directory: apps/provider-mobile
        run: flutter pub get && flutter analyze
