name: C2 Lock Diagnostic

on:
  pull_request:

jobs:
  lock-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Use repository npm toolchain
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"
      - name: Resolve candidate dependency lock without package scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Print dependency graph diagnostics
        run: node .ci/verify-npm-lock.mjs || true
      - name: Upload candidate lock for C2 review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c2-current-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
