name: Deployment Rehearsal Contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: R10 deployment rehearsal contract
    runs-on: ubuntu-24.04
    env:
      CAREPOINT_REHEARSAL_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify exact checkout identity
        run: test "$(git rev-parse HEAD)" = "$CAREPOINT_REHEARSAL_SOURCE_SHA"
      - name: Self-test deployment rehearsal evidence contract
        run: node .ci/release-rehearsal-contract.mjs --self-test
      - name: Generate static migration review inventory
        run: |
          mkdir -p rehearsal-contract-evidence
          node .ci/release-rehearsal-contract.mjs --inventory rehearsal-contract-evidence/migration-inventory.json
      - name: Verify migration inventory is bound to exact checkout
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const inventory = JSON.parse(await readFile("rehearsal-contract-evidence/migration-inventory.json", "utf8"));
          if (inventory.sourceSha !== process.env.CAREPOINT_REHEARSAL_SOURCE_SHA) {
            throw new Error(`Inventory source SHA ${inventory.sourceSha} does not match ${process.env.CAREPOINT_REHEARSAL_SOURCE_SHA}`);
          }
          if (inventory.staticReviewOnly !== true) throw new Error("Migration inventory must remain explicitly static-review-only.");
          console.log(`Migration count: ${inventory.migrationCount}`);
          console.log(`Migration set SHA-256: ${inventory.migrationSetSha256}`);
          console.log(`Migrations with static review flags: ${inventory.migrations.filter((item) => item.staticRiskFlags.length > 0).length}`);
          NODE
      - name: Create and verify evidence checksums
        run: |
          (cd rehearsal-contract-evidence && sha256sum migration-inventory.json > SHA256SUMS)
          (cd rehearsal-contract-evidence && sha256sum --check --strict SHA256SUMS)
      - name: Upload immutable rehearsal-contract evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carepoint-deployment-rehearsal-contract-${{ env.CAREPOINT_REHEARSAL_SOURCE_SHA }}
          path: rehearsal-contract-evidence
          if-no-files-found: error
      - name: Publish sanitized contract summary
        run: |
          {
            echo "### Deployment rehearsal contract"
            echo "- Source SHA: \`$CAREPOINT_REHEARSAL_SOURCE_SHA\`"
            echo "- Contract self-test: PASS"
            echo "- Migration inventory: generated and checksum-verified"
            echo "- Immutable workflow artifact digest: \`${{ steps.upload.outputs.artifact-digest }}\`"
            echo "- This workflow validates the evidence contract and static migration inventory only. It does not deploy, roll back, execute PITR, or close #98."
          } >> "$GITHUB_STEP_SUMMARY"
