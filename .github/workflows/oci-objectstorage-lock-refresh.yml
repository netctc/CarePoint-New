name: OCI Object Storage Lock Refresh

on:
  push:
    branches:
      - feat/r1-oci-object-storage-runtime-binding

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: feat/r1-oci-object-storage-runtime-binding
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Use repository npm toolchain
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"
      - name: Refresh package lock without package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Refresh canonical dependency graph digest
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync, writeFileSync } = require('node:fs');
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          function sortRecursively(value) {
            if (Array.isArray(value)) return value.map(sortRecursively);
            if (!value || typeof value !== 'object') return value;
            return Object.fromEntries(Object.keys(value).sort().map((key) => [key, sortRecursively(value[key])]));
          }
          const digest = createHash('sha256').update(JSON.stringify(sortRecursively(lock))).digest('hex');
          writeFileSync('.ci/npm-package-lock.canonical.sha256', `${digest}\n`);
          console.log(`Canonical digest: ${digest}`);
          NODE
      - name: Commit canonical lock and remove transient workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oci-objectstorage-lock-refresh.yml
          git add package-lock.json .ci/npm-package-lock.canonical.sha256
          git diff --cached --check
          git commit -m "chore: refresh canonical npm lock for OCI Object Storage"
          git push origin HEAD:feat/r1-oci-object-storage-runtime-binding
