name: C7 Patch Communications Transaction

on:
  push:
    branches:
      - feature/phase-c7-durable-notification-outbox

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci(c7): fix communications outbox patch workflow'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-c7-durable-notification-outbox
      - name: Patch communications transactions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('services/api/src/modules/communications/communications.service.ts')
          source = path.read_text()
          old = '    await this.validateAttachments(conversation.patientId, membership.providerId, principal.role, documentIds);\n\n    const encrypted = await this.envelope.encrypt({ schemaVersion: 1, text: body });'
          new = '    await this.validateAttachments(conversation.patientId, membership.providerId, principal.role, documentIds);\n    const notificationRecipients = await this.prisma.careConversationParticipant.findMany({\n      where: { conversationId, leftAt: null, accountId: { not: principal.accountId } },\n      select: { accountId: true },\n    });\n\n    const encrypted = await this.envelope.encrypt({ schemaVersion: 1, text: body });'
          if old not in source: raise SystemExit('Send-message recipient insertion point not found')
          source = source.replace(old, new, 1)
          old = '        await tx.careConversation.update({ where: { id: conversationId }, data: { lastMessageAt: created.sentAt } });\n        return created;'
          new = '        await tx.careConversation.update({ where: { id: conversationId }, data: { lastMessageAt: created.sentAt } });\n        for (const recipient of notificationRecipients) {\n          await this.notifications.enqueueAccountInTransaction(tx, {\n            accountId: recipient.accountId,\n            dedupeKey: `secure-message:${created.id}`,\n            type: "SECURE_MESSAGE",\n            entityType: "CARE_CONVERSATION",\n            entityId: conversationId,\n            safeTitleKey: "notification.message.title",\n            safeBodyKey: "notification.message.body",\n          });\n        }\n        return created;'
          if old not in source: raise SystemExit('Send-message transaction insertion point not found')
          source = source.replace(old, new, 1)
          line = '    await this.notifyOtherParticipants(conversationId, principal.accountId, message.id);\n'
          if source.count(line) != 1: raise SystemExit(f'Expected one post-commit notify line, found {source.count(line)}')
          source = source.replace(line, '    this.notifications.wakeOutbox();\n', 1)
          start_marker = '    const participant = await this.prisma.careConversationParticipant.upsert({\n'
          start = source.find(start_marker)
          if start < 0: raise SystemExit('Participant transaction start not found')
          end = source.find('    return {\n      id: participant.id,', start)
          if end < 0: raise SystemExit('Participant transaction end not found')
          replacement = '\n'.join([
              '    const patient = await this.prisma.patientProfile.findUnique({ where: { id: conversation.patientId }, select: { userId: true } });',
              '    const participant = await this.prisma.$transaction(async (tx) => {',
              '      const created = await tx.careConversationParticipant.upsert({',
              '        where: { conversationId_accountId: { conversationId, accountId: targetAccountId } },',
              '        create: { conversationId, accountId: targetAccountId, providerId: target.id, kind: "PROVIDER" },',
              '        update: { providerId: target.id, kind: "PROVIDER", leftAt: null },',
              '      });',
              '      await this.notifications.enqueueAccountInTransaction(tx, {',
              '        accountId: targetAccountId,',
              '        dedupeKey: `care-participant:${conversation.id}`,',
              '        type: "CARE_COORDINATION",',
              '        entityType: "CARE_CONVERSATION",',
              '        entityId: conversation.id,',
              '        safeTitleKey: "notification.care.title",',
              '        safeBodyKey: "notification.care.body",',
              '      });',
              '      if (patient?.userId) {',
              '        await this.notifications.enqueueAccountInTransaction(tx, {',
              '          accountId: patient.userId,',
              '          dedupeKey: `care-participant:${conversation.id}:${target.id}`,',
              '          type: "CARE_COORDINATION",',
              '          entityType: "CARE_CONVERSATION",',
              '          entityId: conversation.id,',
              '          safeTitleKey: "notification.care.title",',
              '          safeBodyKey: "notification.care.body",',
              '        });',
              '      }',
              '      return created;',
              '    });',
              '    this.notifications.wakeOutbox();',
              '    await this.audit.write({',
              '      actorId: principal.accountId,',
              '      action: "CARE_PARTICIPANT_ADDED",',
              '      objectType: "CARE_CONVERSATION",',
              '      objectId: conversation.id,',
              '      purpose: "CARE_COORDINATION",',
              '      result: "SUCCESS",',
              '      metadata: { targetProviderId: target.id, accessBasis },',
              '    });',
          ]) + '\n'
          source = source[:start] + replacement + source[end:]
          path.write_text(source)
          PY
      - name: Commit transaction coupling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/src/modules/communications/communications.service.ts
          git commit -m "feat(c7): couple communications writes to notification outbox"
          git push origin HEAD:feature/phase-c7-durable-notification-outbox
