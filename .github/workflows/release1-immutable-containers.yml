name: Release 1 Immutable Containers

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".ci/verify-container-supply-chain.mjs"
      - ".ci/verify-immutable-container-release.mjs"
      - "package.json"
      - "package-lock.json"
      - "apps/admin/**"
      - "services/api/**"
      - "packages/contracts/**"
      - "packages/identity/**"
      - "packages/security/**"
      - ".github/workflows/release1-immutable-containers.yml"
  # Every canonical release-line commit is an RC identity. Even release-tooling-only
  # changes must republish images so their embedded revision exactly matches the
  # canonical SHA consumed by G5/G6/G7.
  push:
    branches:
      - "release/release-1-integration-go-live-readiness"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release1-immutable-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

env:
  CAREPOINT_CONTAINER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CAREPOINT_RELEASE_VERSION: release1-${{ github.event.pull_request.head.sha || github.sha }}
  API_IMAGE: ghcr.io/netctc/carepoint-new-api
  ADMIN_IMAGE: ghcr.io/netctc/carepoint-new-admin

jobs:
  build-and-publish:
    name: Build immutable API/Admin OCI candidates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.CAREPOINT_CONTAINER_SOURCE_SHA }}

      - name: Verify exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CAREPOINT_CONTAINER_SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Verify release container supply-chain contracts
        run: |
          node .ci/verify-container-supply-chain.mjs --self-test
          node .ci/verify-container-supply-chain.mjs
          node .ci/verify-immutable-container-release.mjs --self-test
          node .ci/verify-immutable-container-release.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to GHCR for protected release publication
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API candidate once
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: api
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          provenance: ${{ github.event_name == 'push' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name == 'push' && 'true' || 'false' }}
          tags: ${{ env.API_IMAGE }}:candidate-${{ env.CAREPOINT_CONTAINER_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            RELEASE_SHA=${{ env.CAREPOINT_CONTAINER_SOURCE_SHA }}
            RELEASE_VERSION=${{ env.CAREPOINT_RELEASE_VERSION }}

      - name: Attest API candidate provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.API_IMAGE }}
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true

      - name: Build Admin candidate once
        id: admin
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: admin
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          provenance: ${{ github.event_name == 'push' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name == 'push' && 'true' || 'false' }}
          tags: ${{ env.ADMIN_IMAGE }}:candidate-${{ env.CAREPOINT_CONTAINER_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            RELEASE_SHA=${{ env.CAREPOINT_CONTAINER_SOURCE_SHA }}
            RELEASE_VERSION=${{ env.CAREPOINT_RELEASE_VERSION }}

      - name: Attest Admin candidate provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.ADMIN_IMAGE }}
          subject-digest: ${{ steps.admin.outputs.digest }}
          push-to-registry: true

      - name: Verify exact OCI runtime artifacts
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          ADMIN_DIGEST: ${{ steps.admin.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          api_tag="$API_IMAGE:candidate-$CAREPOINT_CONTAINER_SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          admin_tag="$ADMIN_IMAGE:candidate-$CAREPOINT_CONTAINER_SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            [[ "$API_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$ADMIN_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            api_ref="$API_IMAGE@$API_DIGEST"
            admin_ref="$ADMIN_IMAGE@$ADMIN_DIGEST"
            docker pull "$api_ref"
            docker pull "$admin_ref"
          else
            api_ref="$api_tag"
            admin_ref="$admin_tag"
          fi

          for image in "$api_ref" "$admin_ref"; do
            user="$(docker image inspect "$image" --format '{{.Config.User}}')"
            revision="$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
            test -n "$user"
            test "$user" != "0"
            test "$user" != "root"
            test "$revision" = "$CAREPOINT_CONTAINER_SOURCE_SHA"
          done

          docker run --rm --entrypoint openssl "$api_ref" version
          docker run --rm --entrypoint /bin/sh "$api_ref" -c \
            'find /app/node_modules/.prisma/client -maxdepth 1 -type f -name "*openssl-3.0*" -print -quit | grep -q .'
          docker run --rm --entrypoint /bin/sh "$admin_ref" -c \
            'test -f /app/apps/admin/server.js'

      - name: Export immutable candidate manifest
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          ADMIN_DIGEST: ${{ steps.admin.outputs.digest }}
          PUBLISHED: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p immutable-container-evidence
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const published = process.env.PUBLISHED === 'true';
          const digestPattern = /^sha256:[0-9a-f]{64}$/;
          const apiDigest = (process.env.API_DIGEST || '').trim();
          const adminDigest = (process.env.ADMIN_DIGEST || '').trim();
          if (published) {
            if (!digestPattern.test(apiDigest)) throw new Error('Published API image is missing an immutable sha256 digest.');
            if (!digestPattern.test(adminDigest)) throw new Error('Published Admin image is missing an immutable sha256 digest.');
          }
          const evidence = {
            schema: 'carepoint.release1-immutable-containers/v1',
            sourceSha: process.env.CAREPOINT_CONTAINER_SOURCE_SHA,
            releaseVersion: process.env.CAREPOINT_RELEASE_VERSION,
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            eventName: process.env.GITHUB_EVENT_NAME,
            published,
            images: {
              api: { name: process.env.API_IMAGE, digest: published ? apiDigest : null, immutableRef: published ? `${process.env.API_IMAGE}@${apiDigest}` : null },
              admin: { name: process.env.ADMIN_IMAGE, digest: published ? adminDigest : null, immutableRef: published ? `${process.env.ADMIN_IMAGE}@${adminDigest}` : null },
            },
            controls: {
              exactSourceCheckout: true,
              linuxAmd64: true,
              nonMutableLatestTagUsed: false,
              buildOncePromoteByDigest: true,
              runtimeArtifactSmokeVerified: true,
              apiOpenSslVerified: true,
              prismaOpenSsl3EngineVerified: true,
              sbomAttestationOnPublishedImages: published,
              provenanceAttestationOnPublishedImages: published,
              productionDeploymentEvidence: false,
              promotionRequiresDigest: true,
            },
          };
          writeFileSync('immutable-container-evidence/manifest.json', `${JSON.stringify(evidence, null, 2)}\n`, { mode: 0o600 });
          NODE
          sha256sum immutable-container-evidence/manifest.json > immutable-container-evidence/SHA256SUMS
          cat immutable-container-evidence/manifest.json
          sha256sum --check --strict immutable-container-evidence/SHA256SUMS

      - name: Upload immutable container evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release1-immutable-containers-${{ env.CAREPOINT_CONTAINER_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: immutable-container-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Publish sanitized candidate summary
        shell: bash
        run: |
          {
            echo "### Release 1 immutable OCI candidate"
            echo "- Source SHA: \`$CAREPOINT_CONTAINER_SOURCE_SHA\`"
            echo "- Release version: \`$CAREPOINT_RELEASE_VERSION\`"
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            echo "- Published to GHCR: \`${{ github.event_name == 'push' }}\`"
            echo "- Runtime smoke: non-root labels, API OpenSSL/Prisma OpenSSL 3 engine, and Admin standalone entrypoint verified."
            echo "- Promotion contract: use the exact image digest from the immutable manifest; never rebuild or deploy a mutable tag."
            echo "- This workflow produces artifact evidence only; it does not deploy to staging or production."
          } >> "$GITHUB_STEP_SUMMARY"
