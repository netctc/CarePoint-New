name: C7 Patch Slice7 Async

on:
  push:
    branches:
      - feature/phase-c7-durable-notification-outbox

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-c7-durable-notification-outbox
      - name: Patch Slice 7 for durable async delivery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('services/api/scripts/slice7-smoke.mjs')
          source = path.read_text()
          old = "  const patientNotifications = await request('/notifications', { token: patientToken });\n  const replyNotifications = patientNotifications.filter((item) => item.type === 'SECURE_MESSAGE' && item.entityId === conversation.id);\n  if (replyNotifications.length !== 1) throw new Error(`Message retry created duplicate patient notifications: ${replyNotifications.length}.`);\n  const replyNotification = replyNotifications[0];\n  if (JSON.stringify(replyNotification).includes(doctorReplyPlaintext) || replyNotification.safeTitleKey !== 'notification.message.title' || replyNotification.safeBodyKey !== 'notification.message.body') throw new Error('Notification event contains unsafe message content.');\n  const inAppDelivery = replyNotification.deliveries?.find((item) => item.channel === 'IN_APP');\n  const pushDelivery = replyNotification.deliveries?.find((item) => item.channel === 'PUSH');\n  if (inAppDelivery?.status !== 'SENT' || pushDelivery?.status !== 'SENT') throw new Error('Expected in-app and mock push notification delivery did not complete.');\n  if (JSON.stringify(replyNotification.deliveries).includes(endpointRef)) throw new Error('Notification delivery presentation leaked the destination endpoint reference.');\n  const readNotification = await request(`/notifications/${replyNotification.id}/read`, { method: 'POST', token: patientToken, body: {} });\n  if (!readNotification.readAt) throw new Error('Notification read state was not persisted.');\n"
          new = "  let replyNotification;\n  const notificationDeadline = Date.now() + 10000;\n  while (Date.now() < notificationDeadline) {\n    const patientNotifications = await request('/notifications', { token: patientToken });\n    const replyNotifications = patientNotifications.filter((item) => item.type === 'SECURE_MESSAGE' && item.entityId === conversation.id);\n    if (replyNotifications.length > 1) throw new Error(`Message retry created duplicate patient notifications: ${replyNotifications.length}.`);\n    const candidate = replyNotifications[0];\n    if (candidate?.deliveries?.length === 4 && candidate.deliveries.every((item) => item.status !== 'PENDING')) {\n      replyNotification = candidate;\n      break;\n    }\n    await new Promise((resolve) => setTimeout(resolve, 100));\n  }\n  if (!replyNotification) throw new Error('Durable notification outbox did not settle within the Slice 7 acceptance window.');\n  if (JSON.stringify(replyNotification).includes(doctorReplyPlaintext) || replyNotification.safeTitleKey !== 'notification.message.title' || replyNotification.safeBodyKey !== 'notification.message.body') throw new Error('Notification event contains unsafe message content.');\n  const inAppDelivery = replyNotification.deliveries.find((item) => item.channel === 'IN_APP');\n  const pushDelivery = replyNotification.deliveries.find((item) => item.channel === 'PUSH');\n  const emailDelivery = replyNotification.deliveries.find((item) => item.channel === 'EMAIL');\n  const smsDelivery = replyNotification.deliveries.find((item) => item.channel === 'SMS');\n  if (inAppDelivery?.status !== 'SENT' || pushDelivery?.status !== 'SENT' || emailDelivery?.status !== 'SKIPPED' || smsDelivery?.status !== 'SKIPPED') throw new Error('Durable notification channel outcomes are unexpected.');\n  if (JSON.stringify(replyNotification.deliveries).includes(endpointRef)) throw new Error('Notification delivery presentation leaked the destination endpoint reference.');\n  const durableDeliveries = await prisma.notificationDelivery.findMany({ where: { notificationId: replyNotification.id }, orderBy: { channel: 'asc' } });\n  if (durableDeliveries.length !== 4 || durableDeliveries.some((item) => item.status === 'PENDING')) throw new Error('Durable notification outbox rows did not reach terminal states.');\n  if (durableDeliveries.some((item) => item.attemptCount < 1 || item.leaseOwner !== null || item.leaseUntil !== null)) throw new Error('Durable notification leases or attempt accounting are invalid after settlement.');\n  if (durableDeliveries.find((item) => item.channel === 'PUSH')?.providerRef?.startsWith('mock_nt_') !== true) throw new Error('Durable mock push provider reference was not persisted.');\n  const readNotification = await request(`/notifications/${replyNotification.id}/read`, { method: 'POST', token: patientToken, body: {} });\n  if (!readNotification.readAt) throw new Error('Notification read state was not persisted.');\n"
          if old not in source:
              raise SystemExit('Expected synchronous Slice 7 notification block not found')
          source = source.replace(old, new, 1)
          old_summary = "    readReceipts: true, notificationPayloadPhiNeutral: true, notificationDeliveryIdempotent: true,\n    pushEndpointRedacted: true, mockPushDelivered: true, careTeamRelationshipGate: true,"
          new_summary = "    readReceipts: true, notificationPayloadPhiNeutral: true, notificationDeliveryIdempotent: true, durableNotificationOutbox: true,\n    pushEndpointRedacted: true, mockPushDelivered: true, careTeamRelationshipGate: true,"
          if old_summary not in source:
              raise SystemExit('Expected Slice 7 summary block not found')
          path.write_text(source.replace(old_summary, new_summary, 1))
          PY
      - name: Commit async Slice 7 acceptance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/scripts/slice7-smoke.mjs
          git commit -m "test(c7): validate durable asynchronous notification delivery"
          git push origin HEAD:feature/phase-c7-durable-notification-outbox
