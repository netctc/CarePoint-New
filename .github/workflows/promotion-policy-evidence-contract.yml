name: Release 1 Promotion Policy Evidence Contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CAREPOINT_R6_PROMOTION_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    name: R6 promotion policy evidence contract
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.CAREPOINT_R6_PROMOTION_SOURCE_SHA }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Verify exact checkout identity
        run: test "$(git rev-parse HEAD)" = "$CAREPOINT_R6_PROMOTION_SOURCE_SHA"
      - name: Self-test fail-closed promotion policy contract
        run: node .ci/release-promotion-policy-evidence-contract.mjs --self-test
      - name: Verify deliberately blocked promotion policy template
        run: >-
          node .ci/release-promotion-policy-evidence-contract.mjs
          --validate-template ops/release-1/promotion-policy-evidence.example.json
      - name: Capture sanitized promotion-policy contract evidence
        run: |
          mkdir -p promotion-policy-contract-evidence
          node .ci/release-promotion-policy-evidence-contract.mjs \
            --contract-evidence \
            ops/release-1/promotion-policy-evidence.example.json \
            promotion-policy-contract-evidence/contract-evidence.json
          sha256sum \
            .ci/release-promotion-policy-evidence-contract.mjs \
            ops/release-1/promotion-policy-evidence.example.json \
            promotion-policy-contract-evidence/contract-evidence.json \
            > promotion-policy-contract-evidence/SHA256SUMS
          printf 'sourceSha=%s\nrepositoryProtectionApplied=false\nproductionPromotionAuthorized=false\ncodeqlIndependentCheckRequired=true\nblockingIssue=#124\nworkflowPurpose=contract-validation-only\n' \
            "$CAREPOINT_R6_PROMOTION_SOURCE_SHA" \
            > promotion-policy-contract-evidence/metadata.txt
      - name: Upload promotion-policy contract evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carepoint-promotion-policy-contract-${{ env.CAREPOINT_R6_PROMOTION_SOURCE_SHA }}
          path: promotion-policy-contract-evidence
          if-no-files-found: error
