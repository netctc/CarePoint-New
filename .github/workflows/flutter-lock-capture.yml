name: Flutter Lock Capture

on:
  pull_request:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    env:
      CAREPOINT_LOCK_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      CAREPOINT_LOCK_BRANCH: release/release-1-integration-go-live-readiness
    steps:
      - name: Check out exact candidate SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CAREPOINT_LOCK_SOURCE_SHA }}
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.2"
          channel: stable
      - name: Resolve candidate mobile locks for review
        run: |
          (cd packages/mobile_core && flutter pub get)
          (cd apps/patient-mobile && flutter pub get)
          (cd apps/doctor-mobile && flutter pub get)
          (cd apps/provider-mobile && flutter pub get)
          mkdir -p lock-capture/packages/mobile_core lock-capture/apps/patient-mobile lock-capture/apps/doctor-mobile lock-capture/apps/provider-mobile
          cp packages/mobile_core/pubspec.lock lock-capture/packages/mobile_core/pubspec.lock
          cp apps/patient-mobile/pubspec.lock lock-capture/apps/patient-mobile/pubspec.lock
          cp apps/doctor-mobile/pubspec.lock lock-capture/apps/doctor-mobile/pubspec.lock
          cp apps/provider-mobile/pubspec.lock lock-capture/apps/provider-mobile/pubspec.lock
          sha256sum lock-capture/packages/mobile_core/pubspec.lock lock-capture/apps/patient-mobile/pubspec.lock lock-capture/apps/doctor-mobile/pubspec.lock lock-capture/apps/provider-mobile/pubspec.lock > lock-capture/SHA256SUMS
      - name: Upload review-only lock capture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: carepoint-flutter-lock-capture-${{ env.CAREPOINT_LOCK_SOURCE_SHA }}
          path: lock-capture
          if-no-files-found: error
      - name: Commit reviewed generated locks to the release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/mobile_core/pubspec.lock apps/patient-mobile/pubspec.lock apps/doctor-mobile/pubspec.lock apps/provider-mobile/pubspec.lock
          if git diff --cached --quiet; then
            echo "Reviewed lockfiles are already tracked at this dependency graph."
            exit 0
          fi
          git commit -m "ci track deterministic Flutter dependency locks"
          git push origin "HEAD:$CAREPOINT_LOCK_BRANCH"
