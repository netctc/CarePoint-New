name: C6 Fix Histogram Type

on:
  push:
    branches: [feature/phase-c6-opentelemetry-export]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-c6-opentelemetry-export
      - name: Apply strict TypeScript histogram fix
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('services/api/src/infrastructure/observability/otlp-http-exporter.ts')
          source = path.read_text()
          old = '      existing.bucketCounts[bucketIndex(input.durationMs)] += 1;\n'
          new = '      const bucket = bucketIndex(input.durationMs);\n      existing.bucketCounts[bucket] = (existing.bucketCounts[bucket] ?? 0) + 1;\n'
          if old not in source:
              raise SystemExit('Expected histogram accumulation line not found')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/src/infrastructure/observability/otlp-http-exporter.ts
          git commit -m "fix(c6): satisfy strict histogram bucket indexing"
          git push origin HEAD:feature/phase-c6-opentelemetry-export
