name: C2 Finalize Reproducibility

on:
  push:
    branches: [feature/phase-c2-dependency-supply-chain-hardening]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/phase-c2-dependency-supply-chain-hardening
      - name: Switch CI to committed dependency lock
        run: |
          python3 <<'PY'
          from pathlib import Path

          old = '''      - name: Resolve candidate dependency lock without package scripts
                  run: npm install --package-lock-only --ignore-scripts
                - name: Phase C2 verify canonical dependency graph
                  run: node .ci/verify-npm-lock.mjs
                - name: Install verified dependency graph
                  run: npm ci
          '''
          new = '''      - name: Phase C2 verify committed dependency lock
                  run: node .ci/verify-npm-lock.mjs
                - name: Install verified locked dependencies
                  run: npm ci
          '''

          for filename in ['.github/workflows/ci.yml', '.github/workflows/slice10-fhir.yml']:
              path = Path(filename)
              source = path.read_text()
              if old not in source:
                  raise SystemExit(f'Expected C2 dependency resolution block not found in {filename}')
              source = source.replace(old, new, 1)
              if filename.endswith('slice10-fhir.yml'):
                  source = source.replace('    runs-on: ubuntu-latest', '    runs-on: ubuntu-24.04', 1)
              path.write_text(source)

          Path('.github/workflows/c2-finalize-reproducibility.yml').unlink()
          PY
      - name: Commit reproducible CI boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/slice10-fhir.yml .github/workflows/c2-finalize-reproducibility.yml
          git commit -m "ci(c2): consume committed verified dependency lock"
          git push origin HEAD:feature/phase-c2-dependency-supply-chain-hardening
