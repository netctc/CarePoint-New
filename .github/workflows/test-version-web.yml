name: Test Version Web Builds

on:
  pull_request:
    paths:
      - "apps/patient-mobile/**"
      - "apps/doctor-mobile/**"
      - "apps/provider-mobile/**"
      - "packages/mobile_core/**"
      - ".github/workflows/test-version-web.yml"
  workflow_dispatch:
    inputs:
      api_base:
        description: "HTTPS CarePoint test API base, including /api/v1"
        required: true
        type: string
      artifact_label:
        description: "Optional human-readable label for this test bundle"
        required: false
        default: "integrated-test"
        type: string

permissions:
  contents: read

env:
  CAREPOINT_TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CAREPOINT_TEST_API_BASE: ${{ github.event_name == 'workflow_dispatch' && inputs.api_base || 'https://carepoint-web-validation.invalid/api/v1' }}

jobs:
  web:
    name: Web test build (${{ matrix.app }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: patient-mobile
            label: patient
          - app: doctor-mobile
            label: doctor
          - app: provider-mobile
            label: provider
    steps:
      - name: Check out exact candidate SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.CAREPOINT_TEST_SOURCE_SHA }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.2"
          channel: stable

      - name: Verify exact checkout and test API input
        run: |
          test "$(git rev-parse HEAD)" = "$CAREPOINT_TEST_SOURCE_SHA"
          node <<'NODE'
          const raw = process.env.CAREPOINT_TEST_API_BASE || "";
          let url;
          try { url = new URL(raw); } catch { throw new Error("CAREPOINT_TEST_API_BASE must be a valid URL."); }
          if (url.protocol !== "https:") throw new Error("Test API base must use HTTPS.");
          if (url.username || url.password || url.hash) throw new Error("Test API base must not contain credentials or a URL fragment.");
          if (!url.pathname.replace(/\/+$/, "").endsWith("/api/v1")) throw new Error("Test API base must end with /api/v1.");
          NODE

      - name: Resolve tracked dependency graph
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock

      - name: Analyze test client
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze

      - name: Build release web test client
        working-directory: apps/${{ matrix.app }}
        run: >-
          flutter build web --release
          --dart-define=CAREPOINT_BUILD_ENV=test
          --dart-define=CAREPOINT_API_BASE=$CAREPOINT_TEST_API_BASE
          --dart-define=CAREPOINT_RELEASE_SHA=$CAREPOINT_TEST_SOURCE_SHA

      - name: Capture reproducible test-build manifest
        working-directory: apps/${{ matrix.app }}
        env:
          CAREPOINT_TEST_ARTIFACT_LABEL: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_label || 'pull-request-validation' }}
        run: |
          mkdir -p build/test-evidence
          find build/web -type f -print | LC_ALL=C sort | while IFS= read -r file; do sha256sum "$file"; done > build/test-evidence/web-files.sha256
          node <<'NODE' > build/test-evidence/manifest.json
          const api = new URL(process.env.CAREPOINT_TEST_API_BASE);
          process.stdout.write(JSON.stringify({
            sourceSha: process.env.CAREPOINT_TEST_SOURCE_SHA,
            app: process.env.MATRIX_APP,
            platform: "web",
            buildEnvironment: "test",
            apiOrigin: api.origin,
            apiPath: api.pathname,
            artifactLabel: process.env.CAREPOINT_TEST_ARTIFACT_LABEL,
            productionReleaseEvidence: false,
          }, null, 2) + "\n");
          NODE
        env:
          MATRIX_APP: ${{ matrix.app }}
          CAREPOINT_TEST_ARTIFACT_LABEL: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_label || 'pull-request-validation' }}

      - name: Upload deployable web test artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carepoint-test-web-${{ matrix.label }}-${{ env.CAREPOINT_TEST_SOURCE_SHA }}
          path: |
            apps/${{ matrix.app }}/build/web
            apps/${{ matrix.app }}/build/test-evidence
          if-no-files-found: error
          retention-days: 14
