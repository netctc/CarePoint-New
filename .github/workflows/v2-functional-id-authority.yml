name: V2 Functional ID Authority

on:
  pull_request:
    paths:
      - 'docs/v2/traceability/**'
      - '.ci/validate-v2-functional-id-authority.mjs'
      - '.github/workflows/v2-functional-id-authority.yml'
  push:
    branches: [v2/development]
    paths:
      - 'docs/v2/traceability/**'
      - '.ci/validate-v2-functional-id-authority.mjs'
      - '.github/workflows/v2-functional-id-authority.yml'

permissions:
  contents: read

jobs:
  authority:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate frozen V2 functional ID authority
        run: node .ci/validate-v2-functional-id-authority.mjs
