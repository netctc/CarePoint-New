name: Entorno V2 Test Lane

on:
  push:
    branches: [entorno-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run build

  flutter-web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [patient-mobile, doctor-mobile, provider-mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get
      - name: Build web test app
        working-directory: apps/${{ matrix.app }}
        run: flutter build web --release --dart-define=CAREPOINT_API_BASE=https://api.test.invalid/api/v1

  compose-config:
    runs-on: ubuntu-latest
    env:
      TEST_API_DOMAIN: api.test.invalid
      TEST_ADMIN_DOMAIN: admin.test.invalid
      TEST_PATIENT_DOMAIN: patient.test.invalid
      TEST_DOCTOR_DOMAIN: doctor.test.invalid
      TEST_PROVIDER_DOMAIN: provider.test.invalid
      CAREPOINT_API_PUBLIC_BASE: https://api.test.invalid/api/v1
      TEST_POSTGRES_PASSWORD: test-postgres-password
      TEST_REDIS_PASSWORD: test-redis-password
      MFA_ENVELOPE_KEY_BASE64: dGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3Q=
      CLINICAL_ENVELOPE_KEY_BASE64: dGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3Q=
      ORDER_ENVELOPE_KEY_BASE64: dGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3Q=
      ORDER_SIGNING_SECRET_BASE64: dGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3Q=
      DOCUMENT_ENVELOPE_KEY_BASE64: dGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3Q=
      DOCUMENT_SIGNING_SECRET_BASE64: dGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3Q=
      MESSAGING_ENVELOPE_KEY_BASE64: dGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3Q=
      TELEHEALTH_ENVELOPE_KEY_BASE64: dGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3Q=
      TELEHEALTH_MOCK_SIGNING_SECRET: dGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3Q=
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f ops/test-v2/compose.yaml config >/dev/null

  ops-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          for script in ops/test-v2/scripts/*.sh; do
            echo "Checking ${script}"
            bash -n "${script}"
          done
      - name: Validate Nginx template contract
        shell: bash
        run: |
          set -Eeuo pipefail
          template=ops/test-v2/nginx/carepoint-v2-http.conf.template
          for placeholder in \
            __API_DOMAIN__ __ADMIN_DOMAIN__ __PATIENT_DOMAIN__ __DOCTOR_DOMAIN__ __PROVIDER_DOMAIN__; do
            grep -q "${placeholder}" "${template}"
          done
          grep -q '127.0.0.1:4200' "${template}"
          grep -q '127.0.0.1:3200' "${template}"
          grep -q '127.0.0.1:8280' "${template}"
          grep -q '127.0.0.1:8281' "${template}"
          grep -q '127.0.0.1:8282' "${template}"
