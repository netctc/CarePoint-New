name: Mobile Native Compatibility

on:
  pull_request:
    branches:
      - main
      - v2/development
      - entorno-v2
      - "release/**"
  push:
    branches: [main]

permissions:
  contents: read

env:
  CAREPOINT_MOBILE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: mobile-native-compatibility-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android unsigned compatibility (${{ matrix.app }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: patient-mobile
            project: carepoint_patient
          - app: doctor-mobile
            project: carepoint_doctor
          - app: provider-mobile
            project: carepoint_provider
          - app: transport-provider-mobile
            project: carepoint_transport_provider
    steps:
      - name: Check out exact candidate SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.CAREPOINT_MOBILE_SOURCE_SHA }}
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - name: Verify exact checkout identity
        run: test "$(git rev-parse HEAD)" = "$CAREPOINT_MOBILE_SOURCE_SHA"
      - name: Resolve tracked dependency graph
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock
      - name: Align legacy file_picker Android compile SDK
        run: |
          FILE_PICKER_GRADLE="$(find "${PUB_CACHE:-$HOME/.pub-cache}/hosted" -path '*/file_picker-8.3.7/android/build.gradle' -print -quit)"
          test -n "$FILE_PICKER_GRADLE"
          sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/; s/compileSdk[[:space:]]+[0-9]+/compileSdk 36/' "$FILE_PICKER_GRADLE"
          grep -E 'compileSdk(Version)?[[:space:]]+36' "$FILE_PICKER_GRADLE"
      - name: Generate validation-only Android runner
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter create --platforms=android --org io.carepoint.validation --project-name "${{ matrix.project }}" .
          test -f android/app/src/main/AndroidManifest.xml
          grep -R "io.carepoint.validation" android/app/build.gradle* android/app/src/main 2>/dev/null
      - name: Configure Transport Provider foreground location permission
        if: matrix.app == 'transport-provider-mobile'
        working-directory: apps/${{ matrix.app }}
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' android/app/src/main/AndroidManifest.xml
          grep -F 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          ! grep -F 'android.permission.ACCESS_BACKGROUND_LOCATION' android/app/src/main/AndroidManifest.xml

      - name: Build unsigned/non-production Android compatibility APK
        working-directory: apps/${{ matrix.app }}
        shell: bash
        run: |
          set -o pipefail
          build_log="$RUNNER_TEMP/android-${{ matrix.app }}-build.log"
          for attempt in 1 2 3; do
            : > "$build_log"
            if flutter build apk --debug \
              --dart-define=CAREPOINT_BUILD_ENV=development \
              --dart-define=CAREPOINT_API_BASE=https://mobile-validation.invalid/api/v1 \
              --dart-define=CAREPOINT_RELEASE_SHA=${{ env.CAREPOINT_MOBILE_SOURCE_SHA }} \
              2>&1 | tee "$build_log"; then
              exit 0
            fi

            if ! grep -Eqi '429|Too Many Requests|HTTP[^0-9]*(502|503|504)|status code (502|503|504)|Could not GET|timed out|Connection reset|Remote host terminated|Gradle threw an error while downloading artifacts' "$build_log"; then
              echo "::error::Android compatibility build failed with a non-transient error; not retrying."
              exit 1
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Android compatibility build exhausted retries after transient dependency-download failures."
              exit 1
            fi

            delay=$((attempt * 30))
            echo "::warning::Transient dependency-download failure detected; retrying in ${delay}s (attempt $((attempt + 1))/3)."
            sleep "$delay"
          done
      - name: Capture sanitized Android compatibility evidence
        working-directory: apps/${{ matrix.app }}
        run: |
          mkdir -p native-compat-evidence
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > native-compat-evidence/artifact.sha256
          printf 'sourceSha=%s\napp=%s\nplatform=android\nidentityNamespace=io.carepoint.validation\nsigning=debug-validation-only\nproductionReleaseEvidence=false\n' \
            "$CAREPOINT_MOBILE_SOURCE_SHA" "${{ matrix.app }}" > native-compat-evidence/metadata.txt
      - name: Upload Android compatibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carepoint-native-compat-android-${{ matrix.app }}-${{ env.CAREPOINT_MOBILE_SOURCE_SHA }}
          path: apps/${{ matrix.app }}/native-compat-evidence
          if-no-files-found: error

  ios:
    name: iOS simulator compatibility (${{ matrix.app }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: patient-mobile
            project: carepoint_patient
          - app: doctor-mobile
            project: carepoint_doctor
          - app: provider-mobile
            project: carepoint_provider
          - app: transport-provider-mobile
            project: carepoint_transport_provider
    steps:
      - name: Check out exact candidate SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.CAREPOINT_MOBILE_SOURCE_SHA }}
      - name: Select Xcode 26.1.1 compatibility SDK
        run: |
          DEVELOPER_DIR=/Applications/Xcode_26.1.1.app/Contents/Developer
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$DEVELOPER_DIR" xcodebuild -version
          DEVELOPER_DIR="$DEVELOPER_DIR" xcrun --sdk iphonesimulator --show-sdk-version
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - name: Verify exact checkout identity
        run: test "$(git rev-parse HEAD)" = "$CAREPOINT_MOBILE_SOURCE_SHA"
      - name: Resolve tracked dependency graph
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock
      - name: Generate validation-only iOS runner
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter create --platforms=ios --org io.carepoint.validation --project-name "${{ matrix.project }}" .
          test -f ios/Runner/Info.plist
          grep -R "io.carepoint.validation" ios/Runner.xcodeproj/project.pbxproj
      - name: Configure Transport Provider when-in-use location permission
        if: matrix.app == 'transport-provider-mobile'
        working-directory: apps/${{ matrix.app }}
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string CarePoint uses vehicle location only while Transport Provider is actively sharing during an assigned transport." ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" ios/Runner/Info.plist
          ! grep -q 'NSLocationAlways' ios/Runner/Info.plist

      - name: Build non-production iOS simulator compatibility app
        working-directory: apps/${{ matrix.app }}
        run: >-
          flutter build ios --simulator --debug
          --dart-define=CAREPOINT_BUILD_ENV=development
          --dart-define=CAREPOINT_API_BASE=https://mobile-validation.invalid/api/v1
          --dart-define=CAREPOINT_RELEASE_SHA=${{ env.CAREPOINT_MOBILE_SOURCE_SHA }}
      - name: Capture sanitized iOS compatibility evidence
        working-directory: apps/${{ matrix.app }}
        run: |
          mkdir -p native-compat-evidence
          find build/ios/iphonesimulator/Runner.app -type f -print | LC_ALL=C sort | while IFS= read -r file; do shasum -a 256 "$file"; done > native-compat-evidence/app-files.sha256
          printf 'sourceSha=%s\napp=%s\nplatform=ios-simulator\nidentityNamespace=io.carepoint.validation\nsigning=none-simulator\nproductionReleaseEvidence=false\nxcode=%s\n' \
            "$CAREPOINT_MOBILE_SOURCE_SHA" "${{ matrix.app }}" "$(xcodebuild -version | tr '\n' ' ')" > native-compat-evidence/metadata.txt
      - name: Upload iOS compatibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carepoint-native-compat-ios-${{ matrix.app }}-${{ env.CAREPOINT_MOBILE_SOURCE_SHA }}
          path: apps/${{ matrix.app }}/native-compat-evidence
          if-no-files-found: error
