name: OCI SDK Lock Refresh

on:
  push:
    branches:
      - feat/r1-oci-sdk-runtime-binding
    paths:
      - services/api/package.json
      - .github/workflows/oci-sdk-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/r1-oci-sdk-runtime-binding
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Use repository npm toolchain
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"
      - name: Resolve canonical dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Recompute canonical dependency digest
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync, writeFileSync } = require('node:fs');
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          function sortRecursively(value) {
            if (Array.isArray(value)) return value.map(sortRecursively);
            if (!value || typeof value !== 'object') return value;
            return Object.fromEntries(Object.keys(value).sort().map((key) => [key, sortRecursively(value[key])]));
          }
          const digest = createHash('sha256').update(JSON.stringify(sortRecursively(lock))).digest('hex');
          writeFileSync('.ci/npm-package-lock.canonical.sha256', `${digest}\n`);
          NODE
      - name: Commit lock and remove transient workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oci-sdk-lock-refresh.yml
          git add package-lock.json .ci/npm-package-lock.canonical.sha256
          git commit -m "Lock OCI SDK runtime dependencies"
          git push origin HEAD:feat/r1-oci-sdk-runtime-binding
