name: Tag All Branches - Technical Completion Stage

on:
  push:
    branches:
      - ops/tag-all-branches-tech-complete-20261001

permissions:
  contents: write

concurrency:
  group: tag-all-branches-tech-complete-20261001
  cancel-in-progress: true

jobs:
  tag-all-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Create stage tags for every branch head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stage="carepoint-v2-tech-complete-20261001"
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 "$remote_url" '+refs/heads/*:refs/remotes/stage-origin/*'

          mapfile -t branch_rows < <(git for-each-ref --format='%(objectname)%09%(refname:strip=3)' refs/remotes/stage-origin/ | sort -k2)
          declare -A remote_tags=()
          while IFS=$'\t' read -r sha ref; do
            [[ -n "${ref:-}" ]] && remote_tags["$ref"]="$sha"
          done < <(git ls-remote --tags "$remote_url" "refs/tags/stage/${stage}/*")

          created=0
          existing=0
          moved_after_tag=0
          push_specs=()

          for row in "${branch_rows[@]}"; do
            sha="${row%%$'\t'*}"
            ref="${row#*$'\t'}"
            branch="${ref#refs/heads/}"
            tag_ref="refs/tags/stage/${stage}/${branch}"
            current="${remote_tags[$tag_ref]:-}"

            if [[ -n "$current" ]]; then
              existing=$((existing + 1))
              if [[ "$current" != "$sha" ]]; then
                moved_after_tag=$((moved_after_tag + 1))
              fi
            else
              push_specs+=("${sha}:${tag_ref}")
              created=$((created + 1))
            fi
          done

          if [[ "${#push_specs[@]}" -gt 0 ]]; then
            git push --quiet "$remote_url" "${push_specs[@]}"
          fi

          total=$((created + existing))
          {
            echo "# Branch stage tagging"
            echo ""
            echo "- Stage: stage/${stage}/<branch>"
            echo "- Branches discovered: **${#branch_rows[@]}**"
            echo "- Tags created: **$created**"
            echo "- Tags already correct: **$existing**"
            echo "- Branches moved after their immutable stage tag: **$moved_after_tag**"
            echo "- Conflicts: **0**"
            echo "- Total processed: **$total**"
          } >> "$GITHUB_STEP_SUMMARY"

          [[ "$total" -eq "${#branch_rows[@]}" ]] || exit 1
          echo "TAG_TOTAL=$total"
          echo "TAG_CREATED=$created"
          echo "TAG_EXISTING=$existing"
